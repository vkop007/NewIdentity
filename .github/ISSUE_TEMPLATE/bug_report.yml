name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](https://github.com/vkop007/NewIdentity/issues) first.
        **Don't** include real personal data, API tokens, or card details. For security issues, follow [SECURITY.md](https://github.com/vkop007/NewIdentity/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup
        2. Select country "..."
        3. Click "..."
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Identity generation
        - Inbox / OTP
        - Form autofill
        - Proxy
        - Anti-fingerprinting / masking
        - Private card
        - Settings / import / export
        - Popup UI
        - Other
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown on the extension's card in chrome://extensions.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141.0.0.0 on macOS 26
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Website (if relevant)
      description: The page where autofill or spoofing misbehaved.
  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: From the popup (right-click → Inspect) or the service worker (chrome://extensions → Inspect views).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Blur any sensitive information first.
