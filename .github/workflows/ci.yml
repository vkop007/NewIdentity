name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify extension
        run: npm run check

      - name: Build package
        run: npm run package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: new-identity-extension
          path: dist/*.zip
